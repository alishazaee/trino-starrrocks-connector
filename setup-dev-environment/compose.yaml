name: starrocks-trino-dev

services:
  starrocks:
    image: starrocks/allin1-ubuntu:3.5.21
    ports:
      - "8030:8030"
      - "9030:9030"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  trino:
    # Produced by: ./gradlew jibDockerBuild
    image: ${TRINO_STARROCKS_IMAGE:-trino-starrocks:484}
    depends_on:
      starrocks:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/v1/info >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  trino-data:
